server.port=${PORT:3001}

spring.application.name=aal-is-well-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aal_is_well?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.codec.max-in-memory-size=10MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION:900000}
app.groq.api-key=${GROQ_API_KEY:}
app.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
app.sarvam.api-key=${SARVAM_API_KEY:}
app.sarvam.base-url=${SARVAM_BASE_URL:https://api.sarvam.ai}
app.rag.service-url=${RAG_SERVICE_URL:http://localhost:9000}
app.cry-analysis.service-url=${CRY_ANALYSIS_SERVICE_URL:http://localhost:8000}
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.phone-number=${TWILIO_PHONE_NUMBER:}
app.firebase.enabled=${FIREBASE_ADMIN_ENABLED:false}
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.schedulers.reminders.fixed-delay-ms=60000

logging.level.org.springframework.security=INFO

server:
  port: ${PORT:3001}

spring:
  application:
    name: aal-is-well-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/aal_is_well?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  codec:
    max-in-memory-size: 10MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION:900000}
  groq:
    api-key: ${GROQ_API_KEY:}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  sarvam:
    api-key: ${SARVAM_API_KEY:}
    base-url: ${SARVAM_BASE_URL:https://api.sarvam.ai}
  rag:
    service-url: ${RAG_SERVICE_URL:http://localhost:9000}
  cry-analysis:
    service-url: ${CRY_ANALYSIS_SERVICE_URL:http://localhost:8000}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    phone-number: ${TWILIO_PHONE_NUMBER:}
  fcm:
    server-key: ${FCM_SERVER_KEY:}
    endpoint: ${FCM_ENDPOINT:https://fcm.googleapis.com/fcm/send}

logging:
  level:
    org.springframework.security: INFO
